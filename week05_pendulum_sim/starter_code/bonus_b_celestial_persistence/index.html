<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>单摆模拟器 (天体预设与 LocalStorage 持久化) - 进阶挑战 B</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f111a;
      color: #e0e6ed;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    header {
      margin-bottom: 8px;
      text-align: center;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      color: #f0f4f8;
    }
    .badge {
      display: inline-block;
      margin-top: 4px;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 10px;
      background: rgba(0, 150, 136, 0.2);
      color: #80cbc4;
      border: 1px solid rgba(0, 150, 136, 0.4);
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    canvas {
      display: block;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
      border-radius: 12px;
      background: radial-gradient(circle at center, #1b1e2e 0%, #0b0c13 100%);
    }
    /* 天体预设胶囊按钮组 */
    .celestial-bar {
      display: flex;
      gap: 8px;
      background: rgba(20, 24, 38, 0.7);
      padding: 6px 12px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .capsule-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #b0bec5;
      padding: 5px 14px;
      font-size: 0.78rem;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }
    .capsule-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }
    .capsule-btn.active {
      background: linear-gradient(135deg, #00b0ff 0%, #0081cb 100%);
      color: #fff;
      border-color: #00b0ff;
      box-shadow: 0 0 10px rgba(0, 176, 255, 0.5);
    }
    /* 参数控制面板 */
    .control-panel {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 10px 20px;
      background: rgba(20, 24, 38, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      max-width: 800px;
      width: 100%;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 0.8rem;
    }
    .control-label {
      display: flex;
      justify-content: space-between;
      color: #80deea;
    }
    .val-display {
      color: #fff;
      font-family: monospace;
    }
    input[type="range"] {
      -webkit-appearance: none;
      width: 130px;
      height: 5px;
      border-radius: 3px;
      background: #2a2f45;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #00e5ff;
      cursor: pointer;
      box-shadow: 0 0 6px #00e5ff;
    }
    .storage-indicator {
      font-size: 0.72rem;
      color: #81c784;
      display: flex;
      align-items: center;
      gap: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>单摆物理模拟器 (天体预设与持久化)</h1>
      <span class="badge">Bonus Challenge B: 4类重力场切换 + LocalStorage 本地状态存盘</span>
    </header>

    <!-- 天体预设胶囊栏 -->
    <div class="celestial-bar">
      <button class="capsule-btn active" data-gravity="9.8" onclick="setPlanet(this, 9.8)">🌍 地球 (9.8)</button>
      <button class="capsule-btn" data-gravity="1.6" onclick="setPlanet(this, 1.6)">🌕 月球 (1.6)</button>
      <button class="capsule-btn" data-gravity="24.8" onclick="setPlanet(this, 24.8)">🪐 木星 (24.8)</button>
      <button class="capsule-btn" data-gravity="0.0" onclick="setPlanet(this, 0.0)">🌌 太空失重 (0.0)</button>
    </div>

    <canvas id="canvas" width="800" height="420"></canvas>

    <div class="control-panel">
      <div class="control-group">
        <div class="control-label">
          <span>摆长:</span>
          <span id="lenVal" class="val-display">200 px</span>
        </div>
        <input type="range" id="lenSlider" min="100" max="350" value="200" step="1">
      </div>

      <div class="control-group">
        <div class="control-label">
          <span>重力:</span>
          <span id="gravVal" class="val-display">9.8</span>
        </div>
        <input type="range" id="gravSlider" min="0.0" max="25.0" value="9.8" step="0.1">
      </div>

      <div class="control-group">
        <div class="control-label">
          <span>阻尼:</span>
          <span id="dampVal" class="val-display">0.002</span>
        </div>
        <input type="range" id="dampSlider" min="0.000" max="0.010" value="0.002" step="0.0005">
      </div>

      <button style="background:#1e88e5;color:#fff;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:0.8rem;" onclick="resetSwing()">重置摆动</button>
      
      <div class="storage-indicator">
        💾 <span>LocalStorage 已同步</span>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const STORAGE_KEY = 'ncu_pendulum_config_v1';

    const origin = { x: canvas.width / 2, y: 70 };
    let length = 200;
    let gravity = 9.8;
    let targetGravity = 9.8; // 用于重力平滑过渡
    let damping = 0.002;

    let angle = Math.PI / 4;
    let angularVelocity = 0.0;
    let angularAcceleration = 0.0;

    const lenSlider = document.getElementById('lenSlider');
    const gravSlider = document.getElementById('gravSlider');
    const dampSlider = document.getElementById('dampSlider');
    const lenVal = document.getElementById('lenVal');
    const gravVal = document.getElementById('gravVal');
    const dampVal = document.getElementById('dampVal');

    // 1. 本地持久化: 保存配置到 localStorage
    function saveConfig() {
      const config = { length, gravity: targetGravity, damping };
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
      } catch (e) {
        console.warn('LocalStorage save failed:', e);
      }
    }

    // 2. 本地持久化: 页面加载时自动读取
    function loadConfig() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const cfg = JSON.parse(saved);
          if (cfg.length) length = cfg.length;
          if (cfg.gravity !== undefined) {
            gravity = cfg.gravity;
            targetGravity = cfg.gravity;
          }
          if (cfg.damping !== undefined) damping = cfg.damping;

          // 同步到 UI 控件
          lenSlider.value = length;
          lenVal.textContent = length + ' px';
          gravSlider.value = gravity;
          gravVal.textContent = gravity.toFixed(1);
          dampSlider.value = damping;
          dampVal.textContent = damping.toFixed(4);

          // 同步天体按钮的高亮状态
          document.querySelectorAll('.capsule-btn').forEach(btn => {
            const btnG = parseFloat(btn.dataset.gravity);
            if (Math.abs(btnG - gravity) < 0.1) {
              btn.classList.add('active');
            } else {
              btn.classList.remove('active');
            }
          });
        }
      } catch (e) {
        console.warn('LocalStorage load failed:', e);
      }
    }

    // 天体切换
    function setPlanet(el, gVal) {
      document.querySelectorAll('.capsule-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');

      targetGravity = gVal;
      gravSlider.value = gVal;
      gravVal.textContent = gVal.toFixed(1);
      saveConfig();
    }

    lenSlider.addEventListener('input', (e) => {
      length = parseFloat(e.target.value);
      lenVal.textContent = length + ' px';
      saveConfig();
    });

    gravSlider.addEventListener('input', (e) => {
      targetGravity = parseFloat(e.target.value);
      gravVal.textContent = targetGravity.toFixed(1);
      saveConfig();
    });

    dampSlider.addEventListener('input', (e) => {
      damping = parseFloat(e.target.value);
      dampVal.textContent = damping.toFixed(4);
      saveConfig();
    });

    function resetSwing() {
      angle = Math.PI / 4;
      angularVelocity = 0.0;
    }

    let lastTime = performance.now();

    function updatePhysics(dt) {
      // 重力平滑插值过渡
      gravity += (targetGravity - gravity) * Math.min(1, dt * 5);

      const gScaled = gravity * 60;
      angularAcceleration = (-1 * gScaled / length) * Math.sin(angle);
      angularVelocity += angularAcceleration * dt;
      angularVelocity *= Math.max(0, 1 - damping * 60 * dt);
      angle += angularVelocity * dt;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const bobX = origin.x + length * Math.sin(angle);
      const bobY = origin.y + length * Math.cos(angle);

      ctx.beginPath();
      ctx.arc(origin.x, origin.y, 6, 0, Math.PI * 2);
      ctx.fillStyle = '#90caf9';
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(origin.x, origin.y);
      ctx.lineTo(bobX, bobY);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(bobX, bobY, 18, 0, Math.PI * 2);
      ctx.fillStyle = '#00e5ff';
      ctx.shadowColor = '#00e5ff';
      ctx.shadowBlur = 16;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function animate(currentTime) {
      const dt = Math.min((currentTime - lastTime) / 1000, 0.05);
      lastTime = currentTime;

      updatePhysics(dt);
      draw();

      requestAnimationFrame(animate);
    }

    // 初始化加载本地持久化配置
    loadConfig();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
