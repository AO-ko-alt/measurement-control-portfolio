<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>单摆物理模拟器 MVP - 人机协同程序设计</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #1a1a24;
      color: #e0e6ed;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    header {
      position: absolute;
      top: 24px;
      text-align: center;
      z-index: 10;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: #f0f4f8;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-block;
      margin-top: 6px;
      font-size: 0.8rem;
      padding: 3px 10px;
      border-radius: 12px;
      background: rgba(33, 150, 243, 0.2);
      color: #64b5f6;
      border: 1px solid rgba(33, 150, 243, 0.4);
    }
    canvas {
      display: block;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      border-radius: 12px;
      background: radial-gradient(circle at center, #222232 0%, #15151e 100%);
    }
  </style>
</head>
<body>
  <header>
    <h1>单摆物理模拟器 MVP</h1>
    <span class="badge">Task 02: 简谐振动物理模型与 Canvas 渲染</span>
  </header>

  <canvas id="canvas" width="800" height="600"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // 物理参数定义
    const origin = { x: canvas.width / 2, y: 120 }; // 摆动固定支点
    let length = 220;                               // 摆长 L (像素)
    const gravity = 9.8;                            // 重力加速度 g
    let angle = Math.PI / 4;                        // 初始摆角 theta (45度)
    let angularVelocity = 0.0;                      // 角速度 omega
    let angularAcceleration = 0.0;                  // 角加速度 alpha

    // 时间步长与积分模拟
    let lastTime = performance.now();

    function updatePhysics(dt) {
      // 物理公式: theta'' = -(g / L) * sin(theta)
      // 缩放因子保持视觉摆动平滑真实
      const gScaled = gravity * 60; 
      angularAcceleration = (-1 * gScaled / length) * Math.sin(angle);
      
      // 欧拉-克罗默 (Euler-Cromer) 积分法
      angularVelocity += angularAcceleration * dt;
      angle += angularVelocity * dt;
    }

    function draw() {
      // 清空画布
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 计算摆球末端坐标 (x, y)
      const bobX = origin.x + length * Math.sin(angle);
      const bobY = origin.y + length * Math.cos(angle);

      // 1. 绘制支点
      ctx.beginPath();
      ctx.arc(origin.x, origin.y, 6, 0, Math.PI * 2);
      ctx.fillStyle = '#90caf9';
      ctx.shadowColor = '#42a5f5';
      ctx.shadowBlur = 8;
      ctx.fill();

      // 2. 绘制摆线
      ctx.beginPath();
      ctx.moveTo(origin.x, origin.y);
      ctx.lineTo(bobX, bobY);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.lineWidth = 2;
      ctx.shadowBlur = 0;
      ctx.stroke();

      // 3. 绘制发光摆球
      ctx.beginPath();
      ctx.arc(bobX, bobY, 18, 0, Math.PI * 2);
      ctx.fillStyle = '#00e5ff';
      ctx.shadowColor = '#00e5ff';
      ctx.shadowBlur = 16;
      ctx.fill();

      // 内部高光增强质感
      ctx.beginPath();
      ctx.arc(bobX - 4, bobY - 4, 5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
      ctx.shadowBlur = 0;
      ctx.fill();
    }

    function animate(currentTime) {
      const dt = Math.min((currentTime - lastTime) / 1000, 0.05); // 防止大跳帧
      lastTime = currentTime;

      updatePhysics(dt);
      draw();

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
